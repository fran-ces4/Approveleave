kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: SubjectName
    description: The name of a person to filter inbox tasks for.
    entity: PersonNamePrebuiltEntity
    shouldPromptUser: false

modelDescription: |-
  You will respond to requests from a manager who wants to approve, deny, or send back
  an inbox task. Inbox tasks include absence requests, benefits changes, organization
  assignments, and other business processes awaiting the manager's action.

  This topic handles APPROVE, DENY, and SEND BACK actions.
  For simply viewing inbox tasks, use the "View Inbox Tasks" topic.
  This data exclusively belongs to the manager's inbox. Do not respond to requests about other people's inboxes.

  Example invalid requests:
  "Approve my own request"
  "Submit a task"
  "Show me my tasks"

  Example valid requests:
  "Approve the task for John"
  "Deny the benefits change"
  "Send back the absence request"
  "I want to approve a task from my inbox"
  "Approve the pending request"

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SetVariable
      id: set_workday_url
      variable: Topic.WorkdayUrl
      value: https://impl.workday.com/<TENANT_NAME>/home.htmld

    - kind: SetVariable
      id: set_workday_icon_url
      variable: Topic.WorkdayIconUrl
      value: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=

    - kind: BeginDialog
      id: check_manager_status
      displayName: Check manager status
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdayManagerCheck

    # ================================================================
    # Initialize fetch output variables
    # ================================================================
    - kind: SetVariable
      id: init_fetch_is_success
      variable: Topic.fetchIsSuccess
      value: =false

    - kind: SetVariable
      id: init_fetch_error_response
      variable: Topic.fetchErrorResponse
      value: =""

    - kind: SetVariable
      id: init_fetch_response
      variable: Topic.fetchResponse
      value: =""

    # ================================================================
    # Fetch inbox tasks from Workday
    # ================================================================
    - kind: BeginDialog
      id: get_inbox_tasks
      displayName: Fetch inbox tasks from Workday
      input:
        binding:
          parameters: ="{""params"":[{""key"":""{ManagerWorkerId}"",""value"":""" & Global.ESS_UserContext_Employee_Id & """}]}"
          scenarioName: msdyn_HRWorkdayWorkflowManagerGetInboxTasks
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdaySystemGetCommonExecution
      output:
        binding:
          errorResponse: Topic.fetchErrorResponse
          isSuccess: Topic.fetchIsSuccess
          workdayResponse: Topic.fetchResponse

    # ================================================================
    # Handle fetch errors
    # ================================================================
    - kind: ConditionGroup
      id: check_fetch_success
      conditions:
        - id: fetch_failed
          condition: =Topic.fetchIsSuccess = false
          actions:
            - kind: SetVariable
              id: init_fetch_error
              variable: Topic.lastFetchError
              value: =Topic.fetchErrorResponse

            - kind: SetVariable
              id: parse_fetch_error
              variable: Topic.friendlyFetchError
              value: =IfError(Text(ParseJSON(Topic.lastFetchError).error.message), IfError(Text(ParseJSON(Topic.lastFetchError).message), Topic.lastFetchError))

            - kind: AnswerQuestionWithAI
              id: generate_fetch_error
              autoSend: false
              variable: Topic.aiFetchError
              userInput: =Topic.friendlyFetchError
              additionalInstructions: Reframe the following Workday error message in a friendly way for a manager. Keep it to ONE short sentence describing what went wrong. Do NOT include suggestions or next steps. Do NOT apologize. Do NOT use technical jargon.

            - kind: SetVariable
              id: set_final_fetch_error
              variable: Topic.finalFetchError
              value: =If(IsBlank(Topic.aiFetchError), "Something went wrong while retrieving your inbox tasks.", Topic.aiFetchError)

            - kind: SendActivity
              id: fetch_error_message
              activity: "{Topic.finalFetchError}"

            - kind: Question
              id: ask_retry_fetch
              interruptionPolicy:
                allowInterruption: false
              variable: Topic.retryFetchChoice
              prompt: Would you like to try again?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: handle_retry_fetch
              conditions:
                - id: user_wants_retry_fetch
                  condition: =Topic.retryFetchChoice = true
                  actions:
                    - kind: GotoAction
                      id: goto_fetch_on_retry
                      actionId: get_inbox_tasks
              elseActions:
                - kind: SendActivity
                  id: end_on_no_fetch_retry
                  activity: No problem! Let me know if you need anything else.

                - kind: CancelAllDialogs
                  id: cancel_on_no_fetch_retry

    # ================================================================
    # Parse and merge the Workday response
    # ================================================================
    - kind: ParseValue
      id: parse_response
      displayName: Parse Workday response
      variable: Topic.WorkdayResponseRecord
      valueType:
        kind: Record
        properties:
          TaskDescription:
            type:
              kind: Table
              properties:
                Value: String
          TaskType:
            type:
              kind: Table
              properties:
                Value: String
          SubjectWorkerName:
            type:
              kind: Table
              properties:
                Value: String
          CreatedDate:
            type:
              kind: Table
              properties:
                Value: String
          EffectiveDate:
            type:
              kind: Table
              properties:
                Value: String
          TaskStatus:
            type:
              kind: Table
              properties:
                Value: String
          BusinessProcessInstanceID:
            type:
              kind: Table
              properties:
                Value: String
      value: =Topic.fetchResponse

    - kind: SetVariable
      id: merge_records
      displayName: Merge into display table
      variable: Topic.inboxTasksTable
      value: |-
        =ForAll(
            Sequence(CountRows(Topic.WorkdayResponseRecord.TaskDescription)),
            {
                TaskDescription: Last(FirstN(Topic.WorkdayResponseRecord.TaskDescription, Value)).Value,
                TaskType: Last(FirstN(Topic.WorkdayResponseRecord.TaskType, Value)).Value,
                SubjectWorkerName: Last(FirstN(Topic.WorkdayResponseRecord.SubjectWorkerName, Value)).Value,
                CreatedDate: Last(FirstN(Topic.WorkdayResponseRecord.CreatedDate, Value)).Value,
                EffectiveDate: Last(FirstN(Topic.WorkdayResponseRecord.EffectiveDate, Value)).Value,
                TaskStatus: Last(FirstN(Topic.WorkdayResponseRecord.TaskStatus, Value)).Value,
                BusinessProcessInstanceID: Last(FirstN(Topic.WorkdayResponseRecord.BusinessProcessInstanceID, Value)).Value
            }
        )

    # ================================================================
    # Filter by subject name if provided
    # ================================================================
    - kind: ConditionGroup
      id: check_subject_filter
      conditions:
        - id: filter_by_name
          condition: =!IsBlank(Topic.SubjectName)
          actions:
            - kind: SetVariable
              id: apply_name_filter
              variable: Topic.inboxTasksTable
              value: |-
                =Filter(
                    Topic.inboxTasksTable,
                    Topic.SubjectName in SubjectWorkerName
                )

    # ================================================================
    # Check if there are tasks to act on
    # ================================================================
    - kind: ConditionGroup
      id: check_has_tasks
      conditions:
        - id: no_tasks
          condition: =IsEmpty(Topic.inboxTasksTable)
          actions:
            - kind: SendActivity
              id: no_tasks_msg
              activity: Your inbox is clear — there are no tasks waiting for your action right now.

            - kind: CancelAllDialogs
              id: cancel_no_tasks

    - kind: SetVariable
      id: build_intro_message
      variable: Topic.introMessage
      value: ="I found " & Text(CountRows(Topic.inboxTasksTable)) & " task(s) in your inbox. Please select one and choose an action below."

    - kind: SendActivity
      id: intro_message
      activity: "{Topic.introMessage}"

    # ================================================================
    # Show the Adaptive Card form for action
    # ================================================================
    - kind: ConditionGroup
      id: show_form
      conditions:
        - id: always_true
          condition: true
          actions:
            - kind: AdaptiveCardPrompt
              id: collect_action
              displayName: Ask manager to act on task
              card: |-
                ={
                  type: "AdaptiveCard",
                  '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                  version: "1.5",
                  body: [
                    {
                      type: "TextBlock",
                      text: "Act on inbox task",
                      weight: "Bolder",
                      size: "Medium",
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: "Fields marked with * are required.",
                      wrap: true,
                      spacing: "Medium",
                      size: "Small"
                    },
                    {
                      type: "Input.ChoiceSet",
                      id: "selectedTask",
                      label: "Select a task",
                      style: "compact",
                      isRequired: true,
                      errorMessage: "Please select a task.",
                      choices: ForAll(
                        Topic.inboxTasksTable,
                        {
                          title: TaskDescription & " (" & TaskType & ")",
                          value: BusinessProcessInstanceID
                        }
                      )
                    },
                    {
                      type: "Input.ChoiceSet",
                      id: "taskAction",
                      label: "Your decision",
                      style: "expanded",
                      isRequired: true,
                      errorMessage: "Please select an action.",
                      choices: [
                        { title: "Approve", value: "Approve" },
                        { title: "Deny", value: "Deny" },
                        { title: "Send back", value: "Send Back" }
                      ]
                    },
                    {
                      type: "Input.Text",
                      id: "taskComment",
                      label: "Comment (optional)",
                      placeholder: "Add a note...",
                      isMultiline: true
                    },
                    {
                      type: "ColumnSet",
                      spacing: "Medium",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [
                            {
                              type: "ActionSet",
                              actions: [
                                { type: "Action.Submit", title: "Submit", id: "Submit" },
                                { type: "Action.Submit", title: "Cancel", id: "Cancel" }
                              ]
                            }
                          ],
                          verticalContentAlignment: "Center"
                        },
                        {
                          type: "Column",
                          width: "stretch",
                          items: [],
                          verticalContentAlignment: "Center"
                        },
                        {
                          type: "Column",
                          width: "auto",
                          items: [
                            {
                              type: "ColumnSet",
                              spacing: "None",
                              columns: [
                                {
                                  type: "Column",
                                  width: "auto",
                                  items: [
                                    {
                                      type: "Image",
                                      url: Topic.WorkdayIconUrl,
                                      style: "RoundedCorners",
                                      size: "Small",
                                      height: "20px",
                                      width: "20px"
                                    }
                                  ],
                                  verticalContentAlignment: "Center"
                                },
                                {
                                  type: "Column",
                                  width: "auto",
                                  items: [
                                    {
                                      type: "TextBlock",
                                      text: "Workday",
                                      size: "Small",
                                      color: "#242424",
                                      weight: "Bolder"
                                    }
                                  ],
                                  verticalContentAlignment: "Center",
                                  spacing: "Small"
                                }
                              ]
                            }
                          ],
                          verticalContentAlignment: "Center"
                        }
                      ]
                    }
                  ],
                  actions: []
                }
              output:
                binding:
                  actionSubmitId: Topic.actionSubmitId
                  selectedTask: Topic.selectedBPInstanceID
                  taskAction: Topic.taskAction
                  taskComment: Topic.taskComment

              outputType:
                properties:
                  actionSubmitId: String
                  selectedTask: String
                  taskAction: String
                  taskComment: String

    # ================================================================
    # Handle Cancel
    # ================================================================
    - kind: ConditionGroup
      id: handle_cancel
      conditions:
        - id: cancel_pressed
          condition: =Topic.actionSubmitId = "Cancel"
          actions:
            - kind: SendActivity
              id: cancel_msg
              activity: No problem! No changes were made. Let me know if you need anything else.

            - kind: CancelAllDialogs
              id: cancel_all

    # ================================================================
    # Initialize action output variables
    # ================================================================
    - kind: SetVariable
      id: init_action_is_success
      variable: Topic.actionIsSuccess
      value: =false

    - kind: SetVariable
      id: init_action_error_response
      variable: Topic.actionErrorResponse
      value: =""

    - kind: SetVariable
      id: init_action_response
      variable: Topic.actionResponse
      value: =""

    # ================================================================
    # Send the action to Workday
    # ================================================================
    - kind: BeginDialog
      id: execute_action
      displayName: Send action to Workday
      input:
        binding:
          parameters: ="{""params"":[{""key"":""{Business_Process_Instance_ID}"",""value"":""" & Topic.selectedBPInstanceID & """},{""key"":""{Action}"",""value"":""" & Topic.taskAction & """},{""key"":""{Comment}"",""value"":""" & If(IsBlank(Topic.taskComment), "", Topic.taskComment) & """}]}"
          scenarioName: msdyn_HRWorkdayBusinessProcessManagerActOnTask
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdaySystemGetCommonExecution
      output:
        binding:
          errorResponse: Topic.actionErrorResponse
          isSuccess: Topic.actionIsSuccess
          workdayResponse: Topic.actionResponse

    # ================================================================
    # Handle action errors
    # ================================================================
    - kind: ConditionGroup
      id: check_action_result
      conditions:
        - id: action_failed
          condition: =Topic.actionIsSuccess = false
          actions:
            - kind: SetVariable
              id: init_action_error
              variable: Topic.lastActionError
              value: =Topic.actionErrorResponse

            - kind: SetVariable
              id: parse_action_error
              variable: Topic.friendlyActionError
              value: =IfError(Text(ParseJSON(Topic.lastActionError).error.message), IfError(Text(ParseJSON(Topic.lastActionError).message), Topic.lastActionError))

            - kind: AnswerQuestionWithAI
              id: generate_action_error
              autoSend: false
              variable: Topic.aiActionError
              userInput: =Topic.friendlyActionError
              additionalInstructions: Reframe the following Workday error message in a friendly way for a manager. Keep it to ONE short sentence describing what went wrong. Do NOT include suggestions or next steps. Do NOT apologize. Do NOT use technical jargon.

            - kind: SetVariable
              id: set_final_action_error
              variable: Topic.finalActionError
              value: =If(IsBlank(Topic.aiActionError), "The action could not be processed.", Topic.aiActionError)

            - kind: SendActivity
              id: action_error_message
              activity: "{Topic.finalActionError}"

            - kind: Question
              id: ask_retry_action
              interruptionPolicy:
                allowInterruption: false
              variable: Topic.retryActionChoice
              prompt: Would you like to try again?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: handle_retry_action
              conditions:
                - id: user_wants_retry_action
                  condition: =Topic.retryActionChoice = true
                  actions:
                    - kind: GotoAction
                      id: goto_form_on_retry
                      actionId: collect_action
              elseActions:
                - kind: SendActivity
                  id: end_on_no_action_retry
                  activity: No problem! Let me know if you need anything else.

                - kind: CancelAllDialogs
                  id: cancel_on_no_action_retry

    # ================================================================
    # Success — parse response and show confirmation card
    # ================================================================
      elseActions:
        - kind: ParseValue
          id: parse_action_response
          displayName: Parse action response
          variable: Topic.ActionResponseRecord
          valueType:
            kind: Record
            properties:
              EventID:
                type: String
              EventStatus:
                type: String
              SubjectName:
                type: String
          value: =Topic.actionResponse

        - kind: SendActivity
          id: success_card
          activity:
            attachments:
              - kind: AdaptiveCardTemplate
                cardContent: |-
                  ={
                    type: "AdaptiveCard",
                    '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                    version: "1.5",
                    body: [
                      {
                        type: "TextBlock",
                        text: Switch(Topic.taskAction, "Approve", "✅ Task approved", "Deny", "❌ Task denied", "Send Back", "↩️ Task sent back", "Task processed"),
                        weight: "Bolder",
                        size: "Medium",
                        wrap: true
                      },
                      {
                        type: "TextBlock",
                        text: Switch(Topic.taskAction, "Approve", "The task has been approved.", "Deny", "The task has been denied.", "Send Back", "The task has been sent back.", "The action has been processed."),
                        wrap: true,
                        spacing: "Small"
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Subject", value: Topic.ActionResponseRecord.SubjectName },
                          { title: "Action", value: Topic.taskAction },
                          { title: "Status", value: Topic.ActionResponseRecord.EventStatus },
                          { title: "Event ID", value: Topic.ActionResponseRecord.EventID }
                        ]
                      }
                    ],
                    actions: []
                  }

        - kind: SendActivity
          id: follow_up_msg
          activity: Can I help with another task?

        - kind: CancelAllDialogs
          id: end_dialogs

inputType:
  properties:
    SubjectName:
      displayName: SubjectName
      description: The name of a person to filter inbox tasks for.
      type: String

outputType: {}
