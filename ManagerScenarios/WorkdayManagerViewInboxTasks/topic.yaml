kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: SubjectName
    description: The name of a person to filter inbox tasks for.
    entity: PersonNamePrebuiltEntity
    shouldPromptUser: false

modelDescription: |-
  You will respond to requests from a manager who wants to view their Workday inbox tasks.
  Inbox tasks include all actionable items such as absence requests, benefits changes,
  organization assignments, Workday account edits, and other business processes.
  The information is retrieved from the manager's Workday inbox.

  This topic is for VIEWING tasks only — it does not approve or deny them.
  This data exclusively belongs to the manager's inbox. Do not respond to questions about other people's inboxes.

  Example invalid requests:
  "Show me someone else's inbox"
  "Approve time off for John"
  "Submit a task"

  Example valid requests:
  "Show me my inbox tasks"
  "What tasks are waiting for me?"
  "Show my pending tasks"
  "Any items in my Workday inbox?"
  "What needs my attention?"
  "Show tasks for John"

  Your output **must** be a markdown table based on the data in {Topic.inboxTasksTable}.
  Include columns: Task, Subject, Type, Created, Effective Date, and Status.
  If a specific person name is provided, filter to show only tasks related to that person.

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SetVariable
      id: set_workday_url
      variable: Topic.WorkdayUrl
      value: https://impl.workday.com/<TENANT_NAME>/home.htmld

    - kind: SetVariable
      id: set_workday_icon_url
      variable: Topic.WorkdayIconUrl
      value: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=

    - kind: BeginDialog
      id: check_manager_status
      displayName: Check manager status
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdayManagerCheck

    # ================================================================
    # Initialize output variables
    # ================================================================
    - kind: SetVariable
      id: init_is_success
      variable: Topic.isSuccess
      value: =false

    - kind: SetVariable
      id: init_error_response
      variable: Topic.errorResponse
      value: =""

    - kind: SetVariable
      id: init_workday_response
      variable: Topic.workdayResponse
      value: =""

    # ================================================================
    # Fetch inbox tasks from Workday
    # ================================================================
    - kind: BeginDialog
      id: get_inbox_tasks
      displayName: Fetch inbox tasks from Workday
      input:
        binding:
          parameters: ="{""params"":[{""key"":""{ManagerWorkerId}"",""value"":""" & Global.ESS_UserContext_Employee_Id & """}]}"
          scenarioName: msdyn_HRWorkdayWorkflowManagerGetInboxTasks
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdaySystemGetCommonExecution
      output:
        binding:
          errorResponse: Topic.errorResponse
          isSuccess: Topic.isSuccess
          workdayResponse: Topic.workdayResponse

    # ================================================================
    # Handle fetch errors
    # ================================================================
    - kind: ConditionGroup
      id: check_success
      conditions:
        - id: request_failed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SetVariable
              id: init_last_error
              variable: Topic.lastErrorMessage
              value: =Topic.errorResponse

            - kind: SetVariable
              id: parse_error_message
              variable: Topic.friendlyErrorMessage
              value: =IfError(Text(ParseJSON(Topic.lastErrorMessage).error.message), IfError(Text(ParseJSON(Topic.lastErrorMessage).message), Topic.lastErrorMessage))

            - kind: AnswerQuestionWithAI
              id: generate_friendly_error
              autoSend: false
              variable: Topic.aiGeneratedError
              userInput: =Topic.friendlyErrorMessage
              additionalInstructions: Reframe the following Workday error message in a friendly way for a manager. Keep it to ONE short sentence describing what went wrong. Do NOT include suggestions or next steps. Do NOT apologize. Do NOT use technical jargon.

            - kind: SetVariable
              id: set_final_error_message
              variable: Topic.finalErrorMessage
              value: =If(IsBlank(Topic.aiGeneratedError), "Something went wrong while retrieving your inbox tasks.", Topic.aiGeneratedError)

            - kind: SendActivity
              id: friendly_error_message
              activity: "{Topic.finalErrorMessage}"

            - kind: Question
              id: ask_retry
              interruptionPolicy:
                allowInterruption: false
              variable: Topic.retryChoice
              prompt: Would you like to try again?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: handle_retry_choice
              conditions:
                - id: user_wants_retry
                  condition: =Topic.retryChoice = true
                  actions:
                    - kind: GotoAction
                      id: goto_fetch_on_retry
                      actionId: get_inbox_tasks
              elseActions:
                - kind: SendActivity
                  id: end_on_no_retry
                  activity: No problem! Let me know if you need anything else.

                - kind: CancelAllDialogs
                  id: cancel_on_no_retry

    # ================================================================
    # Parse and merge the Workday response
    # ================================================================
    - kind: ParseValue
      id: parse_response
      displayName: Parse Workday response into table
      variable: Topic.WorkdayResponseRecord
      valueType:
        kind: Record
        properties:
          TaskDescription:
            type:
              kind: Table
              properties:
                Value: String
          TaskType:
            type:
              kind: Table
              properties:
                Value: String
          SubjectWorkerName:
            type:
              kind: Table
              properties:
                Value: String
          CreatedDate:
            type:
              kind: Table
              properties:
                Value: String
          EffectiveDate:
            type:
              kind: Table
              properties:
                Value: String
          DueDate:
            type:
              kind: Table
              properties:
                Value: String
          TaskStatus:
            type:
              kind: Table
              properties:
                Value: String
          BusinessProcessInstanceID:
            type:
              kind: Table
              properties:
                Value: String
      value: =Topic.workdayResponse

    - kind: SetVariable
      id: merge_records
      displayName: Merge response records into display table
      variable: Topic.inboxTasksTable
      value: |-
        =ForAll(
            Sequence(CountRows(Topic.WorkdayResponseRecord.TaskDescription)),
            {
                TaskDescription: Last(FirstN(Topic.WorkdayResponseRecord.TaskDescription, Value)).Value,
                TaskType: Last(FirstN(Topic.WorkdayResponseRecord.TaskType, Value)).Value,
                SubjectWorkerName: Last(FirstN(Topic.WorkdayResponseRecord.SubjectWorkerName, Value)).Value,
                CreatedDate: Last(FirstN(Topic.WorkdayResponseRecord.CreatedDate, Value)).Value,
                EffectiveDate: Last(FirstN(Topic.WorkdayResponseRecord.EffectiveDate, Value)).Value,
                DueDate: Last(FirstN(Topic.WorkdayResponseRecord.DueDate, Value)).Value,
                TaskStatus: Last(FirstN(Topic.WorkdayResponseRecord.TaskStatus, Value)).Value,
                BusinessProcessInstanceID: Last(FirstN(Topic.WorkdayResponseRecord.BusinessProcessInstanceID, Value)).Value
            }
        )

    # ================================================================
    # Filter by subject name if provided
    # ================================================================
    - kind: ConditionGroup
      id: check_subject_filter
      conditions:
        - id: filter_by_name
          condition: =!IsBlank(Topic.SubjectName)
          actions:
            - kind: SetVariable
              id: apply_name_filter
              variable: Topic.inboxTasksTable
              value: |-
                =Filter(
                    Topic.inboxTasksTable,
                    Topic.SubjectName in SubjectWorkerName
                )

            - kind: ConditionGroup
              id: check_filtered_results
              conditions:
                - id: no_filtered_results
                  condition: =IsEmpty(Topic.inboxTasksTable)
                  actions:
                    - kind: SendActivity
                      id: no_results_for_subject
                      activity: I couldn't find any inbox tasks related to **{Topic.SubjectName}**.

                    - kind: CancelAllDialogs
                      id: cancel_no_filtered

    # ================================================================
    # Check if there are any tasks at all
    # ================================================================
    - kind: ConditionGroup
      id: check_any_results
      conditions:
        - id: no_results
          condition: =IsEmpty(Topic.inboxTasksTable)
          actions:
            - kind: SendActivity
              id: no_tasks
              activity: Your inbox is clear — there are no tasks waiting for your action right now.

            - kind: CancelAllDialogs
              id: cancel_no_results

    # ================================================================
    # The AI will format Topic.inboxTasksTable as a markdown
    # table per the modelDescription instructions above.
    # ================================================================

inputType:
  properties:
    SubjectName:
      displayName: SubjectName
      description: The name of a person to filter inbox tasks for.
      type: String

outputType:
  properties:
    inboxTasksTable:
      displayName: inboxTasksTable
      type:
        kind: Table
        properties:
          TaskDescription: String
          TaskType: String
          SubjectWorkerName: String
          CreatedDate: String
          EffectiveDate: String
          DueDate: String
          TaskStatus: String
          BusinessProcessInstanceID: String
