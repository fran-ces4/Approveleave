kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: EmployeeName
    description: The name of the direct report whose time-off request should be approved or denied.
    entity: PersonNamePrebuiltEntity
    shouldPromptUser: false

modelDescription: |-
  You will respond to requests from a manager who wants to approve or deny
  a time-off request from one of their direct reports. The action is performed
  in Workday via the Absence Management / Business Process API.

  This topic handles APPROVAL and DENIAL actions only.
  For simply viewing pending requests, use the "View Pending Time Off Requests" topic.
  This data exclusively belongs to the manager's direct reports. Do not respond to requests about the manager's own time off.

  Example invalid requests:
  "Approve my own time off"
  "Submit time off for me"
  "Show me pending requests"

  Example valid requests:
  "Approve time off for John"
  "Deny Sarah's leave request"
  "Approve the pending PTO request"
  "I want to approve a leave request from my team"

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SetVariable
      id: set_workday_url
      variable: Topic.WorkdayUrl
      value: https://impl.workday.com/<TENANT_NAME>/home.htmld

    - kind: SetVariable
      id: set_workday_icon_url
      variable: Topic.WorkdayIconUrl
      value: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=

    # ================================================================
    # DATE CONFIGURATION
    # ================================================================
    - kind: SetVariable
      id: set_as_of_effective_date
      variable: Topic.AsOfEffectiveDate
      value: =Today()

    - kind: BeginDialog
      id: check_manager_status
      displayName: Check manager status
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdayManagerCheck

    # ================================================================
    # Initialize output variables so the static analyzer knows their types
    # ================================================================
    - kind: SetVariable
      id: init_fetch_is_success
      variable: Topic.fetchIsSuccess
      value: =false

    - kind: SetVariable
      id: init_fetch_error_response
      variable: Topic.fetchErrorResponse
      value: =""

    - kind: SetVariable
      id: init_fetch_response
      variable: Topic.fetchResponse
      value: =""

    # ================================================================
    # Fetch pending time-off requests from Workday
    # ================================================================
    - kind: BeginDialog
      id: get_time_off_requests
      displayName: Fetch pending time off requests
      input:
        binding:
          parameters: ="{""params"":[{""key"":""{ManagerOrgId}"",""value"":""" & Global.ESS_UserContext_ManagerOrganizationId & """},{""key"":""{As_Of_Effective_Date}"",""value"":""" & Text(Topic.AsOfEffectiveDate, "yyyy-MM-dd") & """}]}"
          scenarioName: msdyn_HRWorkdayAbsenceManagerGetTimeOffRequests
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdaySystemGetCommonExecution
      output:
        binding:
          errorResponse: Topic.fetchErrorResponse
          isSuccess: Topic.fetchIsSuccess
          workdayResponse: Topic.fetchResponse

    # ================================================================
    # Handle fetch errors
    # ================================================================
    - kind: ConditionGroup
      id: check_fetch_success
      conditions:
        - id: fetch_failed
          condition: =Topic.fetchIsSuccess = false
          actions:
            - kind: SetVariable
              id: init_fetch_error
              variable: Topic.lastFetchError
              value: =Topic.fetchErrorResponse

            - kind: SetVariable
              id: parse_fetch_error
              variable: Topic.friendlyFetchError
              value: =IfError(Text(ParseJSON(Topic.lastFetchError).error.message), IfError(Text(ParseJSON(Topic.lastFetchError).message), Topic.lastFetchError))

            - kind: AnswerQuestionWithAI
              id: generate_fetch_error
              autoSend: false
              variable: Topic.aiFetchError
              userInput: =Topic.friendlyFetchError
              additionalInstructions: Reframe the following Workday error message in a friendly way for a manager. Keep it to ONE short sentence describing what went wrong. Do NOT include suggestions or next steps. Do NOT apologize. Do NOT use technical jargon.

            - kind: SetVariable
              id: set_final_fetch_error
              variable: Topic.finalFetchError
              value: =If(IsBlank(Topic.aiFetchError), "Something went wrong while retrieving time-off requests.", Topic.aiFetchError)

            - kind: SendActivity
              id: fetch_error_message
              activity: "{Topic.finalFetchError}"

            - kind: Question
              id: ask_retry_fetch
              interruptionPolicy:
                allowInterruption: false
              variable: Topic.retryFetchChoice
              prompt: Would you like to try again?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: handle_retry_fetch
              conditions:
                - id: user_wants_retry_fetch
                  condition: =Topic.retryFetchChoice = true
                  actions:
                    - kind: GotoAction
                      id: goto_fetch_on_retry
                      actionId: get_time_off_requests
              elseActions:
                - kind: SendActivity
                  id: end_on_no_fetch_retry
                  activity: No problem! Let me know if you need anything else.

                - kind: CancelAllDialogs
                  id: cancel_on_no_fetch_retry

    # ================================================================
    # Parse and merge the Workday response
    # ================================================================
    - kind: ParseValue
      id: parse_response
      displayName: Parse Workday response
      variable: Topic.WorkdayResponseRecord
      valueType:
        kind: Record
        properties:
          WorkerName:
            type:
              kind: Table
              properties:
                Value: String
          WorkerID:
            type:
              kind: Table
              properties:
                Value: String
          TimeOffType:
            type:
              kind: Table
              properties:
                Value: String
          TimeOffDate:
            type:
              kind: Table
              properties:
                Value: String
          HoursRequested:
            type:
              kind: Table
              properties:
                Value: String
          RequestStatus:
            type:
              kind: Table
              properties:
                Value: String
          BusinessProcessInstanceID:
            type:
              kind: Table
              properties:
                Value: String
          Comment:
            type:
              kind: Table
              properties:
                Value: String
      value: =Topic.fetchResponse

    - kind: SetVariable
      id: merge_records
      displayName: Merge into display table
      variable: Topic.pendingRequestsTable
      value: |-
        =ForAll(
            Sequence(CountRows(Topic.WorkdayResponseRecord.WorkerName)),
            {
                WorkerName: Last(FirstN(Topic.WorkdayResponseRecord.WorkerName, Value)).Value,
                WorkerID: Last(FirstN(Topic.WorkdayResponseRecord.WorkerID, Value)).Value,
                TimeOffType: Last(FirstN(Topic.WorkdayResponseRecord.TimeOffType, Value)).Value,
                TimeOffDate: Last(FirstN(Topic.WorkdayResponseRecord.TimeOffDate, Value)).Value,
                HoursRequested: Last(FirstN(Topic.WorkdayResponseRecord.HoursRequested, Value)).Value,
                RequestStatus: Last(FirstN(Topic.WorkdayResponseRecord.RequestStatus, Value)).Value,
                BusinessProcessInstanceID: Last(FirstN(Topic.WorkdayResponseRecord.BusinessProcessInstanceID, Value)).Value,
                Comment: Last(FirstN(Topic.WorkdayResponseRecord.Comment, Value)).Value
            }
        )

    # ================================================================
    # Filter by employee name if provided
    # ================================================================
    - kind: ConditionGroup
      id: check_employee_filter
      conditions:
        - id: filter_by_name
          condition: =!IsBlank(Topic.EmployeeName)
          actions:
            - kind: SetVariable
              id: apply_name_filter
              variable: Topic.pendingRequestsTable
              value: |-
                =Filter(
                    Topic.pendingRequestsTable,
                    Topic.EmployeeName in WorkerName
                )

    # ================================================================
    # Check if there are requests to act on
    # ================================================================
    - kind: ConditionGroup
      id: check_has_requests
      conditions:
        - id: no_requests
          condition: =IsEmpty(Topic.pendingRequestsTable)
          actions:
            - kind: SendActivity
              id: no_requests_msg
              activity: There are no pending time-off requests to approve or deny at this time.

            - kind: CancelAllDialogs
              id: cancel_no_requests

    - kind: SetVariable
      id: build_intro_message
      variable: Topic.introMessage
      value: ="I found " & Text(CountRows(Topic.pendingRequestsTable)) & " pending request(s). Please review and choose an action below."

    - kind: SendActivity
      id: intro_message
      activity: "{Topic.introMessage}"

    # ================================================================
    # Show the Adaptive Card form for approval
    # ================================================================
    - kind: ConditionGroup
      id: show_form
      conditions:
        - id: always_true
          condition: true
          actions:
            - kind: AdaptiveCardPrompt
              id: collect_approval
              displayName: Ask manager to approve or deny
              card: |-
                ={
                  type: "AdaptiveCard",
                  '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                  version: "1.5",
                  body: [
                    {
                      type: "TextBlock",
                      text: "Approve or deny time off",
                      weight: "Bolder",
                      size: "Medium",
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: "Fields marked with * are required.",
                      wrap: true,
                      spacing: "Medium",
                      size: "Small"
                    },
                    {
                      type: "Input.ChoiceSet",
                      id: "selectedRequest",
                      label: "Select a request",
                      style: "compact",
                      isRequired: true,
                      errorMessage: "Please select a request.",
                      choices: ForAll(
                        Topic.pendingRequestsTable,
                        {
                          title: WorkerName & " — " & TimeOffType & " on " & TimeOffDate & " (" & HoursRequested & " hrs)",
                          value: BusinessProcessInstanceID
                        }
                      )
                    },
                    {
                      type: "Input.ChoiceSet",
                      id: "approvalAction",
                      label: "Your decision",
                      style: "expanded",
                      isRequired: true,
                      errorMessage: "Please select Approve or Deny.",
                      choices: [
                        { title: "Approve", value: "Approve" },
                        { title: "Deny", value: "Deny" }
                      ]
                    },
                    {
                      type: "Input.Text",
                      id: "approvalComment",
                      label: "Comment (optional)",
                      placeholder: "Add a note for the employee...",
                      isMultiline: true
                    },
                    {
                      type: "ColumnSet",
                      spacing: "Medium",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [
                            {
                              type: "ActionSet",
                              actions: [
                                { type: "Action.Submit", title: "Submit", id: "Submit" },
                                { type: "Action.Submit", title: "Cancel", id: "Cancel" }
                              ]
                            }
                          ],
                          verticalContentAlignment: "Center"
                        },
                        {
                          type: "Column",
                          width: "stretch",
                          items: [],
                          verticalContentAlignment: "Center"
                        },
                        {
                          type: "Column",
                          width: "auto",
                          items: [
                            {
                              type: "ColumnSet",
                              spacing: "None",
                              columns: [
                                {
                                  type: "Column",
                                  width: "auto",
                                  items: [
                                    {
                                      type: "Image",
                                      url: Topic.WorkdayIconUrl,
                                      style: "RoundedCorners",
                                      size: "Small",
                                      height: "20px",
                                      width: "20px"
                                    }
                                  ],
                                  verticalContentAlignment: "Center"
                                },
                                {
                                  type: "Column",
                                  width: "auto",
                                  items: [
                                    {
                                      type: "TextBlock",
                                      text: "Workday",
                                      size: "Small",
                                      color: "#242424",
                                      weight: "Bolder"
                                    }
                                  ],
                                  verticalContentAlignment: "Center",
                                  spacing: "Small"
                                }
                              ]
                            }
                          ],
                          verticalContentAlignment: "Center"
                        }
                      ]
                    }
                  ],
                  actions: []
                }
              output:
                binding:
                  actionSubmitId: Topic.actionSubmitId
                  selectedRequest: Topic.selectedBPInstanceID
                  approvalAction: Topic.approvalAction
                  approvalComment: Topic.approvalComment

              outputType:
                properties:
                  actionSubmitId: String
                  selectedRequest: String
                  approvalAction: String
                  approvalComment: String

    # ================================================================
    # Handle Cancel
    # ================================================================
    - kind: ConditionGroup
      id: handle_cancel
      conditions:
        - id: cancel_pressed
          condition: =Topic.actionSubmitId = "Cancel"
          actions:
            - kind: SendActivity
              id: cancel_msg
              activity: No problem! The request has not been changed. Let me know if you need anything else.

            - kind: CancelAllDialogs
              id: cancel_all

    # ================================================================
    # Initialize approval output variables
    # ================================================================
    - kind: SetVariable
      id: init_approve_is_success
      variable: Topic.approveIsSuccess
      value: =false

    - kind: SetVariable
      id: init_approve_error_response
      variable: Topic.approveErrorResponse
      value: =""

    - kind: SetVariable
      id: init_approve_response
      variable: Topic.approveResponse
      value: =""

    # ================================================================
    # Send the approval/denial to Workday
    # ================================================================
    - kind: BeginDialog
      id: execute_approval
      displayName: Send approval decision to Workday
      input:
        binding:
          parameters: ="{""params"":[{""key"":""{Business_Process_Instance_ID}"",""value"":""" & Topic.selectedBPInstanceID & """},{""key"":""{Action}"",""value"":""" & Topic.approvalAction & """},{""key"":""{Comment}"",""value"":""" & If(IsBlank(Topic.approvalComment), "", Topic.approvalComment) & """}]}"
          scenarioName: msdyn_HRWorkdayAbsenceManagerApproveTimeOff
      dialog: msdyn_copilotforemployeeselfservice.topic.WorkdaySystemGetCommonExecution
      output:
        binding:
          errorResponse: Topic.approveErrorResponse
          isSuccess: Topic.approveIsSuccess
          workdayResponse: Topic.approveResponse

    # ================================================================
    # Handle approval errors
    # ================================================================
    - kind: ConditionGroup
      id: check_approve_result
      conditions:
        - id: approve_failed
          condition: =Topic.approveIsSuccess = false
          actions:
            - kind: SetVariable
              id: init_approve_error
              variable: Topic.lastApproveError
              value: =Topic.approveErrorResponse

            - kind: SetVariable
              id: parse_approve_error
              variable: Topic.friendlyApproveError
              value: =IfError(Text(ParseJSON(Topic.lastApproveError).error.message), IfError(Text(ParseJSON(Topic.lastApproveError).message), Topic.lastApproveError))

            - kind: AnswerQuestionWithAI
              id: generate_approve_error
              autoSend: false
              variable: Topic.aiApproveError
              userInput: =Topic.friendlyApproveError
              additionalInstructions: Reframe the following Workday error message in a friendly way for a manager. Keep it to ONE short sentence describing what went wrong. Do NOT include suggestions or next steps. Do NOT apologize. Do NOT use technical jargon.

            - kind: SetVariable
              id: set_final_approve_error
              variable: Topic.finalApproveError
              value: =If(IsBlank(Topic.aiApproveError), "The request could not be processed.", Topic.aiApproveError)

            - kind: SendActivity
              id: approve_error_message
              activity: "{Topic.finalApproveError}"

            - kind: Question
              id: ask_retry_approve
              interruptionPolicy:
                allowInterruption: false
              variable: Topic.retryApproveChoice
              prompt: Would you like to try again?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: handle_retry_approve
              conditions:
                - id: user_wants_retry_approve
                  condition: =Topic.retryApproveChoice = true
                  actions:
                    - kind: GotoAction
                      id: goto_form_on_retry
                      actionId: collect_approval
              elseActions:
                - kind: SendActivity
                  id: end_on_no_approve_retry
                  activity: No problem! Let me know if you need anything else.

                - kind: CancelAllDialogs
                  id: cancel_on_no_approve_retry

    # ================================================================
    # Success — parse response and show confirmation card
    # ================================================================
      elseActions:
        - kind: ParseValue
          id: parse_approve_response
          displayName: Parse approval response
          variable: Topic.ApproveResponseRecord
          valueType:
            kind: Record
            properties:
              EventID:
                type: String
              EventStatus:
                type: String
              WorkerName:
                type: String
          value: =Topic.approveResponse

        - kind: SendActivity
          id: success_card
          activity:
            attachments:
              - kind: AdaptiveCardTemplate
                cardContent: |-
                  ={
                    type: "AdaptiveCard",
                    '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                    version: "1.5",
                    body: [
                      {
                        type: "TextBlock",
                        text: If(Topic.approvalAction = "Approve", "✅ Request approved", "❌ Request denied"),
                        weight: "Bolder",
                        size: "Medium",
                        wrap: true
                      },
                      {
                        type: "TextBlock",
                        text: If(Topic.approvalAction = "Approve", "The time off request has been approved.", "The time off request has been denied."),
                        wrap: true,
                        spacing: "Small"
                      },
                      {
                        type: "Table",
                        spacing: "Medium",
                        showGridLines: false,
                        firstRowAsHeader: false,
                        columns: [
                          { width: 1 },
                          { width: 2 }
                        ],
                        rows: [
                          {
                            type: "TableRow",
                            cells: [
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: "Employee", weight: "Bolder" }]
                              },
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: Topic.ApproveResponseRecord.WorkerName, wrap: true }]
                              }
                            ]
                          },
                          {
                            type: "TableRow",
                            cells: [
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: "Decision", weight: "Bolder" }]
                              },
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: Topic.approvalAction, wrap: true }]
                              }
                            ]
                          },
                          {
                            type: "TableRow",
                            cells: [
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: "Status", weight: "Bolder" }]
                              },
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: Topic.ApproveResponseRecord.EventStatus, wrap: true }]
                              }
                            ]
                          },
                          {
                            type: "TableRow",
                            cells: [
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: "Event ID", weight: "Bolder" }]
                              },
                              {
                                type: "TableCell",
                                items: [{ type: "TextBlock", text: Topic.ApproveResponseRecord.EventID, wrap: true }]
                              }
                            ]
                          }
                        ]
                      },
                      {
                        type: "Container",
                        horizontalAlignment: "Right",
                        items: [
                          {
                            type: "ColumnSet",
                            columns: [
                              {
                                type: "Column",
                                width: "auto",
                                items: [
                                  {
                                    type: "Image",
                                    url: Topic.WorkdayIconUrl,
                                    style: "RoundedCorners",
                                    size: "Small",
                                    height: "20px",
                                    width: "20px"
                                  }
                                ],
                                verticalContentAlignment: "Center"
                              },
                              {
                                type: "Column",
                                width: "auto",
                                items: [
                                  {
                                    type: "TextBlock",
                                    text: "Workday",
                                    size: "Small",
                                    color: "#242424",
                                    weight: "Bolder"
                                  }
                                ],
                                verticalContentAlignment: "Center",
                                spacing: "Small"
                              }
                            ]
                          }
                        ]
                      }
                    ],
                    actions: []
                  }

        - kind: SendActivity
          id: follow_up_msg
          activity: Can I help with another request?

        - kind: CancelAllDialogs
          id: end_dialogs

inputType:
  properties:
    EmployeeName:
      displayName: EmployeeName
      description: The name of the direct report whose request to approve or deny.
      type: String

outputType: {}
